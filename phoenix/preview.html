<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Git Phoenix preview</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .theme { padding: 24px; }
  .light { background: #ffffff; color: #1f2328; }
  .dark { background: #0d1117; color: #e6edf3; }
  h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 16px; }
  figure { margin: 0; }
  figcaption { font-size: 12px; opacity: .7; margin-top: 4px; }
  img { display: block; max-width: 100%; }
</style>
</head>
<body>
<!-- Images load through <img>, the same way GitHub shows them in a README. -->
<section class="theme light"><h2>Light</h2><div class="grid" id="light"></div></section>
<section class="theme dark"><h2>Dark</h2><div class="grid" id="dark"></div></section>
<script>
  const names = ["ash", "ember", "flame", "blaze", "inferno", "reborn"];
  for (const theme of ["light", "dark"]) {
    const grid = document.getElementById(theme);
    for (const name of names) {
      grid.insertAdjacentHTML("beforeend",
        `<figure><img src="preview/${name}-${theme}.svg" width="480" height="332" alt="${name}">` +
        `<figcaption>${name}</figcaption></figure>`);
    }
  }
</script>
</body>
</html>
