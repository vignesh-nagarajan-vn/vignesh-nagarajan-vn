<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Phoenix preview</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 620px), 1fr)); }
  .theme { padding: 20px 16px; min-width: 0; }
  .light { background: #ffffff; color: #1f2328; }
  .dark { background: #0d1117; color: #e6edf3; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  h3 { margin: 20px 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
</style>
</head>
<body>
<div class="themes" id="themes"></div>
<script>
  const rows = [
    ["Ash", "ash"], ["Ember", "ember"], ["Kindling", "kindling"], ["Blaze", "blaze"], ["Inferno", "inferno"],
    ["Rebirth", "rebirth"],
    ["Between ember and kindling, heat 0.18", "heat-18"],
    ["Between kindling and blaze, heat 0.46", "heat-46"],
    ["Between blaze and inferno, heat 0.75", "heat-75"],
    ["Blaze with showGrid off", "no-grid"],
    ["Blaze with showCaption off", "no-caption"],
  ];
  for (const theme of ["light", "dark"]) {
    const col = document.createElement("section");
    col.className = "theme " + theme;
    col.innerHTML = `<h2>${theme[0].toUpperCase() + theme.slice(1)}</h2>` + rows.map(([label, file]) =>
      `<h3>${label}</h3><img src="preview/${file}-${theme}.gif" alt="${label}, ${theme}">`).join("");
    document.getElementById("themes").append(col);
  }
</script>
</body>
</html>
